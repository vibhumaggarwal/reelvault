[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelvault"
version = "1.0.0"
description = "Store any file inside a video and get it back byte-for-byte"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
]

[project.optional-dependencies]
crypto = ["cryptography>=41"]
server = ["fastapi>=0.110", "uvicorn>=0.25", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "httpx", "cryptography>=41", "fastapi>=0.110", "uvicorn>=0.25", "python-multipart>=0.0.9"]

[project.scripts]
reelvault = "reelvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reelvault = ["web/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
