[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelvault"
version = "0.1.0"
description = "Store any file inside a video and get it back byte-for-byte"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
]

[project.optional-dependencies]
crypto = ["cryptography>=41"]
dev = ["pytest>=7", "cryptography>=41"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
